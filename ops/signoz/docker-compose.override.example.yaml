# Copy next to the official deploy/docker/docker-compose.yaml as docker-compose.override.yaml.
# Binds the UI and OTLP listeners to loopback and provisions the root user from the
# environment. Supply every variable through a secret store or the shell, never this file.
services:
  signoz:
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      - "SIGNOZ_USER_ROOT_ENABLED=${SIGNOZ_USER_ROOT_ENABLED:?set SIGNOZ_USER_ROOT_ENABLED}"
      - "SIGNOZ_USER_ROOT_EMAIL=${SIGNOZ_USER_ROOT_EMAIL:?set SIGNOZ_USER_ROOT_EMAIL}"
      - "SIGNOZ_USER_ROOT_PASSWORD=${SIGNOZ_USER_ROOT_PASSWORD:?set SIGNOZ_USER_ROOT_PASSWORD}"
      - "SIGNOZ_USER_ROOT_ORG_NAME=${SIGNOZ_USER_ROOT_ORG_NAME:?set SIGNOZ_USER_ROOT_ORG_NAME}"
      - "SIGNOZ_IDENTN_IMPERSONATION_ENABLED=${SIGNOZ_IDENTN_IMPERSONATION_ENABLED:-false}"
      - "SIGNOZ_IDENTN_TOKENIZER_ENABLED=${SIGNOZ_IDENTN_TOKENIZER_ENABLED:-true}"
      - "SIGNOZ_IDENTN_APIKEY_ENABLED=${SIGNOZ_IDENTN_APIKEY_ENABLED:-true}"
  otel-collector:
    ports: !override
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
